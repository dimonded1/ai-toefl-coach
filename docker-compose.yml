services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: toefl-backend
    expose:
      - "3001"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: toefl-frontend
    environment:
      - BACKEND_ORIGIN=http://backend:3001
      - BACKEND_HOST=backend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: toefl-network
